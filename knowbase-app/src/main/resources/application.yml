server:
  port: 8080

spring:
  application:
    name: knowbase-app
  datasource:
    url: jdbc:postgresql://localhost:5433/knowbase
    username: knowbase
    password: knowbase
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration

knowbase:
  enabled: true
  web:
    exposed: true
  tenant:
    default-tenant-id: default
  persistence:
    enabled: true
  ollama:
    enabled: true
    base-url: http://localhost:11434
    embedding-model: bge-m3
    chat-model: llama3.2
    embedding-dimension: 1024
    timeout: 60s

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

knife4j:
  enable: true
  setting:
    language: zh_cn
