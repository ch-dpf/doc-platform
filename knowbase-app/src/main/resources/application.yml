server:
  port: 8088

logging:
  level:
    root: INFO
    com.knowbase: INFO
    com.knowbase.ingestion: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

spring:
  application:
    name: knowbase-app
  datasource:
    url: jdbc:postgresql://localhost:5433/knowbase
    username: knowbase
    password: knowbase
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 500MB

knowbase:
  enabled: true
  web:
    exposed: true
  tenant:
    default-tenant-id: default
  persistence:
    enabled: true
  flyway:
    enabled: false
  ollama:
    enabled: true
    base-url: http://localhost:11434
    embedding-model: bge-m3
    chat-model: llama3.2
    embedding-dimension: 1024
    timeout: 60s
  vision-document:
    enabled: true
    # paddleocr-vl = 官方完整版面 pipeline (POST /layout-parsing)，推荐
    # vllm = 独立 vLLM OpenAI 接口 (POST /v1/chat/completions)，仅快速验证
    # ollama = 回退到 knowbase.ollama.vision-language-model
    provider: paddleocr-vl
    timeout: 600s
    paddleocr-vl:
      base-url: http://localhost:8888
      layout-parsing-path: /layout-parsing
      pipeline-name: PaddleOCR-VL-1.6
      prettify-markdown: true
      return-markdown-images: false
      visualize: false
  ingestion:
    async-enabled: false
    document-upsert-enabled: true
    promote-eval-gate-enabled: false
    pdf:
      vl-on-scanned: true
      vl-on-low-confidence: true
      vl-low-confidence-threshold: 0.55
      vl-fallback-to-heuristic: true
    ocr:
      default-engine: tesseract
      language: chi_sim+eng
      confidence-threshold: 0.6
      downweight-mode: downweight
    layout:
      default-provider: local-pdf-layout
    reading-order:
      provider: heuristic
      fallback-to-heuristic: true
      timeout: 30s
    summary:
      prompt-id: default_summary
      language: the same language as the source content
      max-input-chars: 16384
      max-output-chars: 500
      min-input-chars: 100
      temperature: 0.3
      max-completion-tokens: 2048
  upload:
    max-file-size-bytes: 209715200
    max-files-per-batch: 50
  storage:
    type: minio
    default-bucket: knowbase
    minio:
      endpoint: http://192.168.14.65:9000
      access-key: minioadmin
      secret-key: minioadmin
      auto-create-bucket: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

knife4j:
  enable: true
  setting:
    language: zh_cn
