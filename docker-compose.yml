services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: knowbase-postgres
    environment:
      POSTGRES_DB: knowbase
      POSTGRES_USER: knowbase
      POSTGRES_PASSWORD: knowbase
    ports:
      - "5433:5432"
    volumes:
      - knowbase_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knowbase -d knowbase"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: knowbase-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - knowbase_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    container_name: knowbase-ollama
    ports:
      - "11434:11434"
    volumes:
      - knowbase_ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  app:
    profiles: ["app"]
    image: eclipse-temurin:21-jre
    container_name: knowbase-app
    working_dir: /workspace
    command:
      - java
      - -jar
      - /workspace/knowbase-app/target/knowbase-app-1.0.0-SNAPSHOT.jar
      - --server.port=8080
      - --spring.datasource.url=jdbc:postgresql://postgres:5432/knowbase
      - --spring.datasource.username=knowbase
      - --spring.datasource.password=knowbase
      - --knowbase.ollama.base-url=http://ollama:11434
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
    ports:
      - "8080:8080"
    volumes:
      - ./:/workspace:ro

volumes:
  knowbase_pg_data:
  knowbase_minio_data:
  knowbase_ollama_data:
