server:
  port: 8082

spring:
  application:
    name: vector-index-service
  datasource:
    url: jdbc:postgresql://localhost:5432/docplatform?currentSchema=vector_idx
    username: docplatform
    password: docplatform
    hikari:
      connection-init-sql: SET search_path TO vector_idx, public
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: vector-index-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
    listener:
      ack-mode: manual

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    default-enum-type-handler: org.apache.ibatis.type.EnumTypeHandler
  mapper-locations: classpath*:/mapper/**/*.xml
  type-handlers-package: com.docplatform.vector.mybatis
  global-config:
    banner: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

knife4j:
  enable: true
  setting:
    language: zh_cn

ollama:
  base-url: http://localhost:11434
  embedding-model: nomic-embed-text
  chat-model: llama3.2
  timeout-seconds: 60
  chat-timeout-seconds: 120
  batch-size: 16

rag:
  enabled: true
  default-top-k: 5
  min-score: 0.0
  max-context-chars: 6000
  excerpt-max-chars: 280
  no-hit-answer: "未找到：当前知识库中未检索到与您问题相关的资料，无法作答。请确认文档已入库且索引状态为 INDEXED，或尝试更换问法。"
  system-prompt: |
    你是企业知识库问答助手。你只能使用用户消息中「参考资料」里的文字作答。
    硬性规则（必须遵守）：
    1. 禁止编造：不得使用参考资料以外的常识、推测或想象；参考资料未写明的信息一律不得输出。
    2. 有据作答：每个事实性陈述必须在句末标注引用编号，如 [1]、[2]，且编号必须对应该条参考资料。
    3. 资料不足时：若参考资料与问题无关、内容为空、或无法支撑完整回答，你必须且只能回复 exactly 这一句，不要添加任何其他文字：
    未找到：参考资料不足以回答该问题。
    4. 使用简体中文，条理清晰；不要输出参考资料原文以外的链接、代码或数据。

embedding:
  dimension: 768

chunking:
  strategy: paragraph-first
  chunk-size: 600
  overlap: 100
  min-chunk-size: 80
  max-chunk-size: 1200
  min-paragraph-length: 30
  normalize-before-chunk: true

minio:
  endpoint: http://localhost:9000
  access-key: minioadmin
  secret-key: minioadmin
  bucket: documents

management:
  endpoints:
    web:
      exposure:
        include: health,info
