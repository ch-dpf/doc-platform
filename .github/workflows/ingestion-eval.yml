name: Ingestion Eval

on:
  push:
    branches: [main, master]
    paths:
      - 'knowbase-ingestion/**'
      - 'knowbase-retrieval/**'
      - 'sample-documents/**'
      - 'scripts/run-ingestion-eval.ps1'
      - 'scripts/run-parse-regression.ps1'
      - '.github/workflows/ingestion-eval.yml'
  pull_request:
    paths:
      - 'knowbase-ingestion/**'
      - 'knowbase-retrieval/**'
      - 'sample-documents/**'
      - 'scripts/run-ingestion-eval.ps1'
      - 'scripts/run-parse-regression.ps1'
      - '.github/workflows/ingestion-eval.yml'

jobs:
  ingestion-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run ingestion eval gate
        run: |
          mvn -q -Dmaven.repo.local=.m2/repository -pl knowbase-ingestion,knowbase-retrieval -am test \
            -Dtest=SampleTableParseRegressionTest,SampleHtmlTableParseRegressionTest,SampleHtmlMergedCellsParseRegressionTest,SamplePdfParseRegressionTest,SampleXlsxParseRegressionTest,SampleOcrHocrRegressionTest,SampleOcrTsvRegressionTest,SampleMarkdownParseRegressionTest,SampleConfigParseRegressionTest,SampleMultiHeaderTableParseRegressionTest,SampleDocumentChunkSnapshotTest,SampleDocumentCatalogCoverageTest,IngestionEvalBaselineTest,IngestionCitationCompletenessEvaluatorTest,FormulaBlockParseEnricherTest,PdfFormulaDetectorTest,PdfTableCellSpanInferrerTest,LayoutBboxSupportTest,PaddleOcrVlPrunedResultMapperTest,TableGridModelTest,TableGridParseEnricherTest,OcrHocrParserTest,OcrRetrievalDownweightSupportTest,DefaultEvidenceBuilderTest \
            -Dsurefire.failIfNoSpecifiedTests=false

      - name: Verify baseline file present
        run: test -f sample-documents/ingestion-eval-baseline.json
