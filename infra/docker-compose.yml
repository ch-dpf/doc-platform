services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: knowbase-postgres
    environment:
      POSTGRES_DB: knowbase
      POSTGRES_USER: knowbase
      POSTGRES_PASSWORD: knowbase
    ports:
      - "5433:5432"
    volumes:
      - knowbase_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knowbase -d knowbase"]
      interval: 5s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    container_name: knowbase-ollama
    ports:
      - "11434:11434"
    volumes:
      - knowbase_ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  minio:
    image: minio/minio:latest
    container_name: knowbase-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - knowbase_minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  knowbase_pg_data:
  knowbase_ollama_data:
  knowbase_minio_data:
